services:
  - type: worker
    name: population-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run render-start
    disk:
      name: population-bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: CENSUS_API_KEY
        sync: false
      - key: BLUESKY_POPULATION_HANDLE
        sync: false
      - key: BLUESKY_POPULATION_APP_PASSWORD
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "15"

  # The age bot needs no API key — birthdays come from congress-legislators,
  # which is a plain public JSON fetch.
  - type: worker
    name: age-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run render-start-age
    disk:
      name: age-bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: BLUESKY_AGE_HANDLE
        sync: false
      - key: BLUESKY_AGE_APP_PASSWORD
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "15"
